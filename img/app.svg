<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ffffff" role="img" aria-label="MetroViz">
  <title>MetroViz</title>
  <!-- NC convention: app.svg is rendered WHITE. NC's topbar shows it as-is
       (white on dark chrome). For light contexts (file lists, app menus on
       bright themes) NC applies `filter: var(--background-image-invert-if-bright)`
       which inverts the white to black. Same pattern as apps/files/img/app.svg. -->
  <path d="M 4 18 L 8 18 L 16 6 L 20 6"
        stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="8" cy="18" r="2"/>
  <circle cx="16" cy="6" r="2"/>
</svg>
