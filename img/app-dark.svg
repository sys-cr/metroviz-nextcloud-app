<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ffffff" role="img" aria-label="MetroViz">
  <title>MetroViz</title>
  <!-- Dark-theme variant: same shape as app.svg, but pinned to white fill so
       it stays visible on dark backgrounds for code paths that don't use
       currentColor (legacy NC themes, embedded contexts). -->
