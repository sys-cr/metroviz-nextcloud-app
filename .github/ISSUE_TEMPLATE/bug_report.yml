name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: When I click X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Files → MetroViz folder
        2. Double-click a `.metro` file
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: nc-version
    attributes:
      label: Nextcloud version
      placeholder: e.g. 30.0.2 (`occ status`)
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.2.15 (`php -v`)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser + OS
      placeholder: e.g. Firefox 124 on macOS 14
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: Any errors or warnings from DevTools → Console
      render: text

  - type: checkboxes
    id: pre-checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This is not a Nextcloud-core bug (verified by trying with the MetroViz app disabled)
