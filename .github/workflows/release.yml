name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-and-release:
        name: Build tarball and publish release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Extract version from tag
              id: version
              run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

            - name: Verify version matches appinfo/info.xml
              run: |
                  declared=$(grep -oE '<version>[^<]+' appinfo/info.xml | sed 's/<version>//')
                  if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
                      echo "Tag version (${{ steps.version.outputs.version }}) does not match appinfo/info.xml (<version>$declared</version>)."
                      echo "Bump info.xml or fix the tag, then retry."
                      exit 1
                  fi

            - name: Build clean tarball
              run: |
                  mkdir -p build
                  git archive --format=tar --prefix=metroviz/ HEAD | gzip > build/metroviz-${{ steps.version.outputs.version }}.tar.gz
                  sha256sum build/metroviz-${{ steps.version.outputs.version }}.tar.gz > build/metroviz-${{ steps.version.outputs.version }}.tar.gz.sha256

            - name: List archive contents (sanity check)
              run: |
                  echo "Top-level entries inside the tarball:"
                  tar -tzf build/metroviz-${{ steps.version.outputs.version }}.tar.gz | awk -F/ '{print $1"/"$2}' | sort -u

            - name: Create GitHub Release with tarball attached
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" \
                      build/metroviz-${{ steps.version.outputs.version }}.tar.gz \
                      build/metroviz-${{ steps.version.outputs.version }}.tar.gz.sha256 \
                      --title "MetroViz ${GITHUB_REF_NAME}" \
                      --generate-notes
